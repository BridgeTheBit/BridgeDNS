plugins { id 'com.android.application' }
android {
    namespace 'dev.bridgedns.vpn'
    compileSdk 35
    defaultConfig { applicationId 'dev.bridgedns.vpn'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.2.1'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
