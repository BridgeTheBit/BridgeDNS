name: Build and release BridgeDNS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  ANDROID_API: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK: '28.0.13004108'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64-v8a
            abis: arm64-v8a
          - target: armeabi-v7a
            abis: armeabi-v7a
          - target: x86_64
            abis: x86_64
          - target: universal
            abis: arm64-v8a armeabi-v7a x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          check-latest: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build native libraries
        env:
          ABIS: ${{ matrix.abis }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK"
          bash scripts/build-native.sh

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAVA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bridgedns-release.keystore"
          chmod 600 "$RUNNER_TEMP/bridgedns-release.keystore"

      - name: Build signed APK
        env:
          NAVA_ABI: ${{ matrix.abis }}
          NAVA_OUTPUT_NAME: BridgeDNS-${{ matrix.target }}-v${{ steps.version.outputs.version }}.apk
          NAVA_SIGNING_KEYSTORE: ${{ runner.temp }}/bridgedns-release.keystore
          NAVA_KEY_ALIAS: ${{ secrets.NAVA_KEY_ALIAS }}
          NAVA_KEYSTORE_PASSWORD: ${{ secrets.NAVA_KEYSTORE_PASSWORD }}
          NAVA_KEY_PASSWORD: ${{ secrets.NAVA_KEY_PASSWORD }}
        run: bash scripts/build-sdk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeDNS-${{ matrix.target }}-v${{ steps.version.outputs.version }}
          path: app/build/sdk/BridgeDNS-${{ matrix.target }}-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  release:
    name: Publish BridgeDNS GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: BridgeDNS-*-v${{ steps.version.outputs.version }}
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then tag="${INPUT_TAG:-v${VERSION}}"; fi
          test -n "$tag"
          gh release create "$tag" release-assets/*.apk \
            --title "BridgeDNS ${tag}" \
            --generate-notes
